# .github/workflows/release.yml

name: Build, Test, Publish & Generate Release Notes

on:
  push:
    tags:
      - 'v*'  # 仅在推送 v* 格式的标签时触发 (e.g., v1.0.0, v1.2.3)

# 权限设置：
# contents: write - 允许创建 GitHub Release
# Release Notes 直接从 docs/release_notes/<版本>.md 读取，无任何外部 AI 依赖
permissions:
  contents: write

jobs:
  build-test-publish-release:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout source code
      uses: actions/checkout@v5
      with:
        # 拉取所有历史记录，以便能比较不同 tag 之间的差异
        fetch-depth: 0

    - name: Set up Python
      uses: actions/setup-python@v6
      with:
        python-version: '3.11'

    # 构建、测试、打包 ...
    - name: Install dependencies
      run: |
        pip install -r requirements.txt
        pip install -e .

    - name: Test with pytest
      run: |
        pip install pytest
        pytest

    - name: Build package
      run: |
        pip install setuptools wheel
        python setup.py sdist bdist_wheel
        
    # ------------------------------------------------------------------
    # 准备 Release Notes：
    #   优先读取 docs/release_notes/<版本>.md（支持 v0.7.4.md 与 0.7.4.md 两种命名）
    #   若文件不存在，则用两个 tag 之间的 git 提交记录自动生成友好的兜底内容
    # ------------------------------------------------------------------

    - name: 1. Prepare release notes
      id: prepare_release_notes
      run: |
        # 当前标签（如 v0.7.4），以及去掉 v 前缀的版本号（如 0.7.4）
        CURRENT_TAG=${{ github.ref_name }}
        VERSION=${CURRENT_TAG#v}
        NOTES_DIR="docs/release_notes"

        echo "Current tag is: $CURRENT_TAG"

        # 按优先级查找手写的发布说明文件
        NOTES_FILE=""
        for candidate in "$NOTES_DIR/$CURRENT_TAG.md" "$NOTES_DIR/$VERSION.md"; do
          if [ -f "$candidate" ]; then
            NOTES_FILE="$candidate"
            break
          fi
        fi

        BODY_FILE=$(mktemp)

        if [ -n "$NOTES_FILE" ]; then
          echo "Using release notes from: $NOTES_FILE"
          cp "$NOTES_FILE" "$BODY_FILE"
        else
          echo "No release notes found in $NOTES_DIR/ (looked for $CURRENT_TAG.md / $VERSION.md),"
          echo "falling back to auto-generated git commit log."

          # 获取上一个标签，确定本次发布包含的提交范围
          PREVIOUS_TAG=$(git tag --sort=-v:refname | head -n 2 | tail -n 1)
          if [ -z "$PREVIOUS_TAG" ]; then
            echo "No previous tag found. Using all commits."
            RANGE=""
          else
            echo "Previous tag is: $PREVIOUS_TAG"
            RANGE="$PREVIOUS_TAG..$CURRENT_TAG"
          fi

          COMMIT_COUNT=$(git rev-list --count ${RANGE:-HEAD})

          # 生成友好的 Markdown 兜底内容
          {
            echo "## 📦 $CURRENT_TAG"
            echo ""
            echo "> 本次发布未提供专门的发布说明（未找到 \`$NOTES_DIR/$CURRENT_TAG.md\`），以下内容由提交记录自动生成。"
            echo ""
            if [ "$COMMIT_COUNT" -gt 0 ]; then
              echo "### 提交记录（共 $COMMIT_COUNT 次）"
              echo ""
              # 每条记录包含：短哈希、提交说明、作者、日期
              git log ${RANGE:-HEAD} --date=short \
                --pretty=format:"- \`%h\` %s  <br/>_&nbsp;&nbsp;&nbsp;&nbsp;%an · %ad_"
              echo ""
            else
              echo "本次标签与上一版本之间没有新的提交记录。"
            fi
          } > "$BODY_FILE"
        fi

        echo "------------- Release Notes -------------"
        cat "$BODY_FILE"
        echo ""
        echo "-----------------------------------------"

        # 将最终内容写入 step 输出（使用唯一分隔符，避免与正文冲突）
        {
          echo "release_body<<RELEASE_NOTES_EOF"
          cat "$BODY_FILE"
          echo "RELEASE_NOTES_EOF"
        } >> "$GITHUB_OUTPUT"

    # ------------------------------------------------------------------
    # 发布到 PyPI 和 GitHub Release 的步骤
    # ------------------------------------------------------------------

    - name: Publish to PyPI
      env:
        TWINE_USERNAME: __token__
        TWINE_PASSWORD: ${{ secrets.PYPI_API_TOKEN }}
      run: |
        pip install twine
        twine upload dist/*

    - name: Create GitHub Release with Notes
      uses: softprops/action-gh-release@v1
      with:
        # 使用准备好的发布说明（手写文件优先，git 提交记录兜底）
        body: ${{ steps.prepare_release_notes.outputs.release_body }}
        # 上传打包好的文件
        files: dist/*